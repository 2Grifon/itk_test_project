[project]
name = "itk_test_project"
version = "0.1.0"
dependencies = [
    "alembic==1.18.1",
    "fastapi[standard]==0.135.1",
    "fastapi-pagination==0.15.10",
    "psycopg[binary]==3.3.2",
    "pydantic-settings==2.12.0",
    "pytest==9.0.2",
    "sqlmodel==0.0.37",
    "uvicorn[standard]==0.42.0",
]

[project.optional-dependencies]
dev = [
    "black==26.1.0", 
    "flake8==7.3.0",
    "pre-commit==4.5.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    \.venv
  | alembic/versions/.*
)/
'''

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
